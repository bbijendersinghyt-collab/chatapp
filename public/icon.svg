<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1B263B"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#8338EC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#1E3A8A" stroke-width="6"/>

  <!-- Subtle grid lines in background -->
  <path d="M24 160 H488 M24 290 H488 M160 24 V488 M320 24 V488" stroke="#1E293B" stroke-width="2" opacity="0.3"/>

  <!-- Calculator Frame Outline -->
  <rect x="100" y="80" width="312" height="352" rx="36" fill="#0B132B" stroke="#00F0FF" stroke-width="4" filter="url(#glow)"/>

  <!-- Calculator Screen with Math Formula -->
  <rect x="126" y="110" width="260" height="74" rx="16" fill="#030712" stroke="#1D4ED8" stroke-width="2"/>
  <text x="365" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94A3B8" text-anchor="end">∫ 2x dx = x² + C</text>
  <text x="365" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#00F0FF" text-anchor="end">SCAN READY</text>

  <!-- Buttons Grid -->
  <circle cx="160" cy="230" r="22" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="160" y="238" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#93C5FD" text-anchor="middle">sin</text>

  <circle cx="224" cy="230" r="22" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="224" y="238" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#93C5FD" text-anchor="middle">cos</text>

  <circle cx="288" cy="230" r="22" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="288" y="238" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#93C5FD" text-anchor="middle">√</text>

  <circle cx="352" cy="230" r="22" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
  <text x="352" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">÷</text>

  <circle cx="160" cy="294" r="22" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="160" y="302" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">7</text>

  <circle cx="224" cy="294" r="22" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="224" y="302" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">8</text>

  <circle cx="288" cy="294" r="22" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="288" y="302" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">9</text>

  <circle cx="352" cy="294" r="22" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
  <text x="352" y="302" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">×</text>

  <!-- Big Central Floating Camera Target Aperture Badge -->
  <g transform="translate(256, 360)">
    <circle cx="0" cy="0" r="48" fill="url(#neonBlue)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="40" fill="#0B132B"/>
    <!-- Camera Icon with AI Star -->
    <path d="M-18 -8 L-12 -18 L12 -18 L18 -8 H22 C25 -8 27 -6 27 -3 V17 C27 20 25 22 22 22 H-22 C-25 22 -27 20 -27 17 V-3 C-27 -6 -25 -8 -22 -8 Z" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="7" r="9" fill="none" stroke="#00F0FF" stroke-width="3"/>
    <!-- Laser scanner line -->
    <line x1="-36" y1="7" x2="36" y2="7" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2"/>
  </g>
</svg>
