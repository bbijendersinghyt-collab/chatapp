    <script>
      // Gracefully handle benign Vite HMR WebSocket disconnects in proxy / iframe environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event?.reason?.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event?.message && (event.message.includes('WebSocket closed') || event.message.includes('@vite/client'))) {
          event.preventDefault();
        }
      });
    </script>
  </head>
